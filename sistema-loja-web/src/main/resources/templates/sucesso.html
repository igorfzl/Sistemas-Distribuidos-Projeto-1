<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Compra Concluída</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }

        .mensagem {
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-left: 6px solid #28a745;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            text-align: left;
        }

        h1 {
            color: #28a745;
            text-align: center;
        }

        .log-item {
            background: #eee;
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
            border-left: 4px solid #007bff;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 25px;
            text-decoration: none;
            color: white;
            background-color: #007bff;
            padding: 10px 20px;
            border-radius: 4px;
        }

        .voltar:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<div class="mensagem">
    <h1>Compra Processada!</h1>
    <p>Abaixo está o rasto de comunicação entre os microsserviços:</p>

    <div th:each="linha : ${resultados}">
        <div class="log-item" th:text="${linha}"></div>
    </div>

    <p style="margin-top: 20px; text-align: center;"><strong>Verifique também a IDE para os logs
        oficiais.</strong></p>

    <a href="/" class="voltar">Voltar à Loja</a>
</div>
</body>
</html>
